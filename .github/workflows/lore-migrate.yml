name: DeepSeek LORE migration

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: Larry-Wayn/lore@91875cc7e4abbc6d137da44ab55554250bbae253
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          mode: migrate
